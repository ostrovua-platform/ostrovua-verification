user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ── Logging ──────────────────────────────────────────────
    log_format main '$remote_addr - $remote_user [$time_local] '
                    '"$request" $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main buffer=16k;

    # ── Performance ───────────────────────────────────────────
    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  65;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens      off;

    # ── Gzip ─────────────────────────────────────────────────
    gzip              on;
    gzip_vary         on;
    gzip_proxied      any;
    gzip_comp_level   6;
    gzip_buffers      16 8k;
    gzip_http_version 1.1;
    gzip_types
        text/plain text/css text/xml text/javascript
        application/json application/javascript application/xml+rss
        application/atom+xml image/svg+xml;

    # ── Rate limiting ─────────────────────────────────────────
    limit_req_zone $binary_remote_addr zone=graphql:10m rate=30r/s;
    limit_req_zone $binary_remote_addr zone=api:10m     rate=10r/s;
    limit_req_zone $binary_remote_addr zone=auth:10m    rate=5r/m;   # strict: 5 auth reqs/min
    limit_conn_zone $binary_remote_addr zone=addr:10m;

    # Only media formats accepted by the auth service may be rendered inline.
    # PDF and every unknown/legacy extension are always downloaded.
    map $uri $upload_content_disposition {
        default                                                "attachment";
        ~*\.(?:jpg|png|gif|webp|heic|avif|mp4|mov|m4a|webm)$   "inline";
    }

    # ── Upstream: Hasura ──────────────────────────────────────
    upstream hasura {
        server hasura:8080;
        keepalive 32;
    }

    # ── Upstream: Auth microservice ───────────────────────────
    upstream auth {
        server auth:3001;
        keepalive 8;
    }

    # ── HTTP → HTTPS redirect ─────────────────────────────────
    server {
        listen 80;
        listen [::]:80;
        server_name _;

        # Let's Encrypt challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # ── HTTPS main server ─────────────────────────────────────
    server {
        listen 443 ssl;
        http2 on;
        listen [::]:443 ssl;
        server_name ostrovua.online;

        # ── SSL ──────────────────────────────────────────────
        ssl_certificate     /etc/letsencrypt/live/ostrovua.online/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/ostrovua.online/privkey.pem;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # ── Security headers ─────────────────────────────────
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header X-Frame-Options           "SAMEORIGIN"    always;
        add_header X-Content-Type-Options    "nosniff"       always;
        add_header X-XSS-Protection          "1; mode=block" always;
        add_header Referrer-Policy           "strict-origin-when-cross-origin" always;
        # script-src має 'unsafe-inline': застосунок — single-file з inline-скриптом
        # та inline-обробниками (onclick). cdnjs — для Chart.js. XSS додатково
        # гаситься через safeUrl() у фронті (без javascript:-посилань).
        add_header Content-Security-Policy   "default-src 'self'; script-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; connect-src 'self'; font-src 'self' data:; frame-ancestors 'none';" always;
        add_header Permissions-Policy        "geolocation=(), microphone=(), camera=()" always;

        # ── Завантаження вкладень чату (файли до 25 МБ без стиснення) ──
        #    base64 у JSON ≈ ×1.37, тому ліміт тіла 36m.
        location /auth/upload {
            limit_req zone=api burst=10 nodelay;
            limit_req_status 429;
            client_max_body_size 36m;

            proxy_pass         http://auth;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 120s;
            proxy_send_timeout 120s;
        }

        # ── Роздача файлів чату ───────────────────────────────
        # Only canonical server-generated names are reachable. The local
        # types table deliberately replaces /etc/nginx/mime.types, so a
        # legacy .html/.svg/.js upload can never regain an active MIME type.
        location ~ "^/files/(?<upload_file>[0-9a-f]{32}\.(?:jpg|png|gif|webp|heic|avif|mp4|mov|m4a|webm|pdf))$" {
            alias /var/www/uploads/$upload_file;
            expires 30d;
            types {
                image/jpeg       jpg;
                image/png        png;
                image/gif        gif;
                image/webp       webp;
                image/heic       heic;
                image/avif       avif;
                video/mp4        mp4;
                video/quicktime  mov;
                audio/mp4        m4a;
                video/webm       webm;
                application/pdf  pdf;
            }
            default_type application/octet-stream;
            add_header Cache-Control             "public, immutable" always;
            add_header Content-Disposition       $upload_content_disposition always;
            add_header X-Content-Type-Options     "nosniff" always;
            add_header Content-Security-Policy    "default-src 'none'; sandbox" always;
            add_header Cross-Origin-Resource-Policy "same-origin" always;
            add_header Referrer-Policy            "no-referrer" always;
        }

        # Fail closed for non-canonical and legacy names.
        location /files/ {
            return 404;
        }

        # ── LiveKit: WebSocket групових дзвінків (wss → ws) ──
        location /livekit/ {
            proxy_pass         http://host.docker.internal:7880/;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            # Дзвінок живе годинами — не рвати зʼєднання
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
        }

        # ── Дзвінкові endpoint-и: часті звернення, швидка зона ──
        #    Строга зона auth (для логінів) давала 429 → «Сервер
        #    дзвінків недоступний» при повторних спробах подзвонити.
        location ~ ^/auth/(turn-credentials|livekit-token|call-invite)$ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;

            proxy_pass         http://auth;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── APNs / PushKit token-и: ідемпотентна реєстрація пристрою ──
        # iOS може одночасно повернути APNs і VoIP token під час старту.
        # Ці автентифіковані upsert/remove запити не повинні витрачати
        # захисний бюджет login/register (auth = 5 запитів/хв).
        location ~ ^/auth/device-token(?:/remove)?$ {
            limit_req zone=api burst=10 nodelay;
            limit_req_status 429;

            proxy_pass         http://auth;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Auth microservice ─────────────────────────────
        location /auth/ {
            limit_req zone=auth burst=3 nodelay;
            limit_req_status 429;

            # Аватар профілю теж іде base64 (POST /auth/update-avatar)
            client_max_body_size 8m;

            proxy_pass         http://auth;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 30s;
        }

        # ── Верифікація (QR handoff): поллінг статусу кожні 3с —
        #    строгa auth-зона (5r/m) не підходить, тут zone=api (10r/s).
        location /auth/verify/ {
            limit_req zone=api burst=20 nodelay;
            limit_req_status 429;
            client_max_body_size 12m;

            proxy_pass         http://auth;
            proxy_http_version 1.1;
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 90s;
        }

        # Internal session revocation gate for Hasura. Every GraphQL request
        # requires an active, non-revoked server-side session.
        location = /_auth_session {
            internal;
            proxy_pass              http://auth/auth/introspect;
            proxy_pass_request_body off;
            proxy_set_header        Content-Length "";
            proxy_set_header        Authorization $http_authorization;
            proxy_set_header        X-Real-IP $remote_addr;
            proxy_set_header        X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header        X-Forwarded-Proto $scheme;
            proxy_set_header        X-Original-URI $request_uri;
        }

        # ── GraphQL endpoint ─────────────────────────────────
        location /v1/graphql {
            limit_req zone=graphql burst=50 nodelay;
            limit_conn addr 20;
            auth_request /_auth_session;

            # Вкладення в чаті (фото/файли) летять як base64 у самому
            # запиті. Стандартний ліміт 1 МБ рубав їх на льоту — і
            # застосунок показував «сервер не відповідає» (E-002).
            client_max_body_size 8m;

            proxy_pass         http://hasura;
            proxy_http_version 1.1;
            proxy_set_header   Upgrade $http_upgrade;
            proxy_set_header   Connection "upgrade";   # WebSocket support
            proxy_set_header   Host $host;
            proxy_set_header   X-Real-IP $remote_addr;
            proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header   X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_send_timeout 300s;

            # Cache GET queries (optional, be careful with auth)
            # proxy_cache_valid 200 1m;
        }

        # ── Hasura admin API (/v1/metadata, /v1/query, …) — ЗАКРИТО ──
        #   Адмін працює через SSH-тунель напряму до :8080 (див. DEPLOY.md).
        #   Публічний /v1/graphql обробляється окремим блоком вище (більш специфічний).
        location /v1/ {
            deny all;
        }

        # ── Hasura console (local dev only — disable in prod) ─
        location /console {
            deny all;
        }

        # ── Health check ─────────────────────────────────────
        location /healthz {
            proxy_pass http://hasura/healthz;
            access_log off;
        }

        # ── Static frontend (contributors.html) ──────────────
        location = / {
            root /usr/share/nginx/html;
            try_files /index.html =404;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        location = /index.html {
            root /usr/share/nginx/html;
            add_header Cache-Control "no-cache, no-store, must-revalidate";
            expires -1;
        }

        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
            expires 1h;
            add_header Cache-Control "public, must-revalidate";
        }
    }
}
